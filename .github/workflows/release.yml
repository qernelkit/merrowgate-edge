# Tests, then builds the gateway image for both depot hardware types, pushes it and signs it.
# Depot nodes only pull images whose signature verifies against this workflow's identity.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: registry.merrowgate.example/edge/gateway

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
        working-directory: portal

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.merrowgate.example
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: sigstore/cosign-installer@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            MQTT_RELAY_PASSWORD=${{ secrets.MQTT_RELAY_PASSWORD }}
          secrets: |
            fieldops_password=${{ secrets.FIELDOPS_PASSWORD }}
      - name: Sign the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
