# Portal and edge TLS certificate for depot clusters that do not run cert-manager. Where cert-manager
# runs, apply certificate.yaml instead: it manages a Secret of the same name.
apiVersion: v1
kind: Secret
metadata:
  name: portal-tls
  namespace: merrowgate-edge
  labels:
    app.kubernetes.io/name: edge-gateway
    app.kubernetes.io/component: portal
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
