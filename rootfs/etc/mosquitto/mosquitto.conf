# /etc/mosquitto/mosquitto.conf: depot telemetry broker.
# Scanners, the dock displays and the yard system connect with device certificates on 8883; the sensor
# gateways, whose radios cannot hold a certificate, use a pre-shared key on 8884. edgectl's relay
# publishes the readings devices post to the control API over the loopback listener.

# Each listener has its own way in (password, certificate, PSK). Keeping the PSK file off the 8883
# listener also keeps TLS 1.3 there: mosquitto only does PSK over TLS 1.2.
per_listener_settings true

persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 300
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
max_packet_size 262144

# edgectl's relay (account device-relay in the password file)
listener 1883 127.0.0.1
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Devices with certificates from the device CA; the certificate CN is the MQTT username.
listener 8883
allow_anonymous false
acl_file /etc/mosquitto/acl
certfile /etc/merrowgate/pki/portal/portal.crt
keyfile /etc/merrowgate/pki/portal/portal.key
cafile /etc/merrowgate/pki/device-ca.crt
require_certificate true
use_identity_as_username true
tls_version tlsv1.3
ciphers_tls1.3 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

# Sensor gateways: TLS-PSK, the PSK identity is the MQTT username.
listener 8884
allow_anonymous false
acl_file /etc/mosquitto/acl
psk_file /etc/mosquitto/psk.txt
psk_hint merrowgate-depot-sensors
tls_version tlsv1.2
ciphers PSK-AES128-GCM-SHA256
use_identity_as_username true
# Gateways sleep between readings, so allow long keepalives (applies to every listener).
max_keepalive 120
