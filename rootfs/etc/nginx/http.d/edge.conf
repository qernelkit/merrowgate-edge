# Depot-facing HTTPS on 443: the edgectl control API, the device portal, the field-operations page and
# firmware downloads. edgectl and the portal listen on loopback only.

upstream edgectl {
	server 127.0.0.1:9443;
	keepalive 16;
}

upstream portal {
	server 127.0.0.1:8444;
	keepalive 8;
}

# Plain-HTTP health endpoint for the container healthcheck (healthcheck.sh); loopback only.
server {
	listen 127.0.0.1:9000;
	location = /healthz {
		proxy_pass https://edgectl/healthz;
	}
	location / {
		return 404;
	}
}

# A client that names none of our hosts gets the image's self-signed certificate and a closed connection.
server {
	listen 443 ssl default_server;
	server_name _;
	ssl_certificate /etc/merrowgate/pki/fallback.crt;
	ssl_certificate_key /etc/merrowgate/pki/fallback.key;
	return 444;
}

server {
	listen 443 ssl;
	http2 on;
	server_name edge.merrowgate.example portal.merrowgate.example;

	# The leaf only: depot devices are provisioned with chain.pem when they are enrolled.
	ssl_certificate /etc/merrowgate/pki/portal/portal.crt;
	ssl_certificate_key /etc/merrowgate/pki/portal/portal.key;
	ssl_trusted_certificate /etc/merrowgate/pki/portal/chain.pem;

	# Scanners and sensor gateways present a client certificate from the device CA; staff browsers do not.
	ssl_client_certificate /etc/merrowgate/pki/device-ca.crt;
	ssl_verify_client optional;
	ssl_verify_depth 2;

	# edgectl and the portal both accept TLS 1.3 only on loopback.
	proxy_ssl_protocols TLSv1.3;
	proxy_ssl_session_reuse on;

	keepalive_timeout 65;

	# Firmware link secret, shared with the fleet console that mints the links. The entrypoint writes it to
	# /run/merrowgate/nginx/ from FIRMWARE_LINK_SECRET; without it, firmware downloads are switched off.
	set $firmware_link_secret "";
	include /run/merrowgate/nginx/*.conf;

	location /api/ {
		limit_req zone=token_bucket burst=40 nodelay;
		proxy_pass https://edgectl;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Client-Verify $ssl_client_verify;
		proxy_set_header X-Client-DN $ssl_client_s_dn;
	}

	location /portal/ {
		proxy_pass https://portal;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	# Field engineers' status page, served by edgectl. Basic auth on top of the depot VPN.
	location /ops/ {
		auth_basic "Merrowgate field operations";
		auth_basic_user_file /etc/nginx/.htpasswd;
		proxy_pass https://edgectl;
		proxy_set_header Host $host;
	}

	# Expiring firmware links: /firmware/<model>/<file>?md5=<link hash>&expires=<unix time>
	location /firmware/ {
		if ($firmware_link_secret = "") {
			return 503;
		}
		secure_link $arg_md5,$arg_expires;
		secure_link_md5 "$secure_link_expires$uri $firmware_link_secret";
		if ($secure_link = "") {
			return 403;
		}
		if ($secure_link = "0") {
			return 410;
		}
		alias /var/lib/merrowgate/firmware/;
	}
}
