# Port 8443 is for the handheld scanners bought in 2017, which two depots still run. Their firmware stops
# at TLS 1.0/1.1 and a few CBC suites, so they get a listener of their own and nothing else has to accept
# those settings. Retire this file when the last of them is replaced.
server {
	listen 8443 ssl;
	server_name scanners.merrowgate.example;

	ssl_certificate /etc/merrowgate/pki/portal/portal.crt;
	ssl_certificate_key /etc/merrowgate/pki/portal/portal.key;
	ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
	ssl_ciphers AES128-SHA:DES-CBC3-SHA:ECDHE-RSA-AES128-SHA:@SECLEVEL=0;
	access_log /dev/stdout tlsinfo;

	# The scanners only post telemetry and read the depot settings.
	location ~ ^/api/v1/(telemetry|depot)$ {
		limit_req zone=token_bucket burst=20;
		proxy_pass https://edgectl;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Device-Class handheld-2017;
	}

	location / {
		return 404;
	}
}
