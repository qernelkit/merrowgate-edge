# /etc/nginx/nginx.conf: Merrowgate edge gateway.
# nginx terminates TLS for depot devices and field engineers. Sites live in http.d/: edge.conf for the
# control API, the portal and firmware downloads, scanner-devices.conf for the older handheld scanners.

user nginx;
worker_processes auto;
pcre_jit on;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

include /etc/nginx/modules/*.conf;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	sendfile on;
	tcp_nopush on;
	client_max_body_size 4m;
	server_tokens off;
	limit_req_zone $binary_remote_addr zone=token_bucket:10m rate=20r/s;
	# TLS policy for every listener unless a site sets its own.
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
	ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1;
	ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
	# What each device negotiated, for the fleet dashboard's protocol breakdown.
	log_format tlsinfo '$remote_addr $ssl_protocol $ssl_cipher $status';

	ssl_prefer_server_ciphers on;
	ssl_dhparam /etc/nginx/dhparam.pem;
	ssl_session_cache shared:edge_tls:10m;
	ssl_session_timeout 1h;
	ssl_session_tickets off;

	log_format main '$remote_addr - $remote_user [$time_local] "$request" '
	                '$status $body_bytes_sent "$http_user_agent" rt=$request_time';
	access_log /dev/stdout main;

	# Devices retry hard after a depot power cut; the zone above smooths that out per address.
	limit_req_status 429;

	include /etc/nginx/http.d/*.conf;
}
