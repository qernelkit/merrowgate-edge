<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merrowgate depot portal</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1d2433; }
    header { background: #1d3557; color: #fff; padding: 0.75rem 1.25rem; display: flex; gap: 1.5rem; align-items: center; }
    header a { color: #e8eef6; text-decoration: none; }
    header a.active { font-weight: 600; text-decoration: underline; }
    main { padding: 1.25rem; max-width: 1100px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.75rem; }
    .tile { background: #fff; border-radius: 6px; padding: 0.75rem; border-left: 6px solid hsl(var(--hue), 55%, 45%); }
    .tile small { color: #5b6475; }
    form { display: grid; gap: 0.5rem; max-width: 320px; }
    input, button { font: inherit; padding: 0.4rem 0.6rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <header>
    <strong>Merrowgate depot portal</strong>
    <nav>
      <a href="#/devices">Devices</a>
      <a href="#/pair">Pair a device</a>
      <a href="#/shipments">Shipments</a>
    </nav>
  </header>
  <main id="main"></main>
  <script src="/portal/app.js" defer></script>
</body>
</html>
